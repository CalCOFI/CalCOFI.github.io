<!-- calcofi.io brand (v2) — paste verbatim into <head>, BEFORE any stylesheet.
     An APP puts  <meta name="cc-scale" content="app">  ABOVE this block (the inline snippet copies it onto
     <html data-cc-scale> before first paint); a page declares nothing and gets the reading scale.
     The inline script must be inline: it sets the theme before first paint so there is no flash of the
     wrong colour. theme.js then takes over. Light is the default; a stored choice is honoured only when the
     visitor made it (cc_theme_src=user), so a v1 page's default can never leak into a v2 page. -->
