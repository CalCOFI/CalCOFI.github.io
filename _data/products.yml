# Products shown on calcofi.io. One card per product; `section` controls
# placement. Cards are named for the thing itself — the repo or app name used
# everywhere else (db-viz-hex, not "Integrated App") — so a card, its source,
# its status page and its usage report are obviously the same product. Student
# contributions keep human-friendly titles.
#
# Canonical app URLs follow uptime/.upptimerc.yml (https://app.calcofi.io/<app>/).
#
# status:       active (default, no badge) | interim | superseded | archived
# superseded_by: key of the replacing product (renders "superseded by <link>")
# extra_links:  [{label, url}] — extra deep links in the card's link row
# shots:        themed — the product honours ?theme= and has images/<key>_{dark,light}.png
#               (img: then just names the dark one as a fallback)
#               (scripts/shots.py); the card swaps them with the site's theme toggle
# added:        YYYY-MM-DD — when the site started carrying the product (back-filled 2026-09-07 from
#               each product's first commit in this file; the four renamed to db-* on 2026-07-01
#               existed under their old keys since 2026-06-10). The ship's log (_plugins/news.rb)
#               makes a "New: <title>" entry of it, and the header's News link wears a dot for 30 days
# credits:      {org, year, team[]} — shown on student contributions
# tab:          the section tab this card is drawn in (sections[].tabs[].id) — the ONE thing that
#               places a card on the front door since 2026-09-10 (D7). Tab ids are unique across
#               sections, so a panel selects on `tab:` alone.
# group:        an eyebrow group inside a section (Explore's `across` / `one`), from sections[].groups.
#               No longer drawn on the landing page (tabs replaced it), but still READ by
#               _plugins/datasets.rb for the group chip on a dataset page's Access > Explore rows —
#               as is `section: students`, which is how that chip reads "Student contribution".
# lenses:       the spatial grains an Explore app shows the data at — ids from sections[explore].lenses
#               (stations · hexagons · cruises · regions · sections · contours); drawn as suffix
#               icons after the card's title and on a dataset page's Access > Explore row
# dataset_url_realm: bio | env — the deep link only selects a dataset of this realm; a dataset of
#               the other realm gets the plain app link (db-viz-hex's ?datasets= is taxa-only)
# dataset_url_env: a second template for the env realm where the app opens on an environmental
#               dataset by a different parameter (db-viz-hex's ?env= selects the dataset's leading
#               variable and turns Compare on); with it set, dataset_url_realm governs dataset_url only
# datasets:     the dataset_keys this product covers — a list, or `all` (every dataset in the
#               release record). Validated at build against _data/datasets.json's datasets[] and
#               holdings[]: an unknown key FAILS the build (plan D-2). It is also the reverse index
#               behind each dataset page's Access > Explore rows, so this is the ONE place a
#               product-to-dataset link is written.

# sections: the six words of the header — DATA · APPS · ACCESS · BUILD · DOCS · NEWS (plan
# 2026-09-10 § D7, Ben's scheme) — plus calcofi.org ↗, seven items in all. One list drives the
# header, the sticky section bar and the page, so they can never drift.
#
# kind:   section (default) — drawn on the landing page under its own `id` anchor
#         page             — a link only (`url:`); no section is drawn (docs, news)
# tabs:   [{id, title, blurb, count}] — a crowded section is tabbed, each tab with a count PILL.
#         `count` names where the pill's number is read from when it is not "how many products
#         carry this tab": `datasets` · `species` · `measurements` resolve through
#         site.data.catalog.numbers (_includes/tab_count.html). A count the build cannot read
#         collapses the pill; it is never typed.
# groups: RETIRED from the page by D7 (the Explore eyebrow groups became tabs) but KEPT here
#         because _plugins/datasets.rb reads sections[].groups[] to title the group chip on a
#         dataset page's Access > Explore rows. Products keep `group:` for the same reason.
sections:
  - id: datasets
    emoji: "🗂"
    title: Data
    tabs:
      - id: datasets
        title: Datasets
        count: datasets
        blurb: Who collected what — coverage, every endpoint, licence and citation.
      - id: species
        title: Species
        count: species
        url: /species/          # the header links the dedicated page, not the homepage tab (Ben, 2026-09-10)
        data: species            # …when site.data.species exists; otherwise the tab, as before
        blurb: Every organism counted, in which datasets and years.
      - id: measurements
        title: Measurements
        count: measurements
        url: /measurements/
        data: measurements
        blurb: Every ocean variable measured, in which datasets, years and depths.
    # one line: the three ways in are named by the tabs beneath it, each with its own blurb, so the
    # section's own blurb says what the three ARE and gets out of the way (the Data section may not
    # grow by more than 120 px — scripts/check_layout.py asserts it)
    blurb: >-
      Find what has been collected — by <b>dataset</b>, by <b>species</b> or by <b>measurement</b>,
      each with its own catalog.
  - id: explore
    emoji: "🔭"
    featured: true
    title: Apps
    tabs:
      - id: explorer
        title: Explorer
        blurb: >-
          One browser-native app over every ingested dataset, at six spatial grains.
      - id: general
        title: General
        blurb: >-
          Apps that each go deep on one grain — station, hexagon, cruise, or contour.
      - id: dataset
        title: Dataset
        blurb: >-
          Apps focused on a single dataset or data source.
      - id: student
        title: Student
        blurb: >-
          Capstone and fellowship projects by university students partnering with CalCOFI.
    # the lenses, with the brand glyph each is drawn as (brand/v2/icons/, lens-*)
    lenses:
      - { id: stations, title: Stations, blurb: one value per station, the CalCOFI grid as points }
      - { id: hexagons, title: Hexagons, blurb: H3 hexagons, aggregated at a chosen resolution }
      - { id: cruises, title: Cruises, blurb: one cruise at a time, along its track }
      - { id: regions, title: Regions, blurb: pooled over a boundary or a region }
      # a depth section where there is depth (Environment) and a years section where there is not
      # (Biology: one value per tow, no profile) — the lens is the same line either way
      - { id: sections, title: Sections, blurb: "stations along a CalCOFI line × depth for one cruise (Environment), or × years where the data have no depth (Biology)" }
      - { id: contours, title: Contours, blurb: interpolated maps of one variable }
    groups:
      - id: across
        title: Across datasets
        blurb: >-
          The Explorer brings the spatial grains together as lenses in one app; the others each go
          deep on one grain — station, hexagon, cruise, or contour.
      - id: one
        title: One dataset
        blurb: >-
          Apps focused on a single dataset or data source.
    blurb: >-
      Explore CalCOFI data in the browser — the Explorer across every dataset, the general apps
      that each go deep on one grain, the apps built around a single dataset, and the student
      projects.
  - id: access
    emoji: "☁️"
    title: Access
    tabs:
      - id: services
        title: Services
        blurb: Standards-based services, public cloud storage and browser SQL.
      - id: packages
        title: Packages
        blurb: The R and Python packages that read a release directly.
    blurb: >-
      The ways to get the data: standards-based services and public cloud storage, browser SQL, and
      the R and Python packages that read a release directly.
  - id: build
    emoji: "🛠"
    title: Build
    blurb: >-
      The pipeline behind every release and the database tooling — the ingest workflows, calcofi4db
      and the schema browser. The documentation is its own door now, in the header, for everyone.
  # docs and news are PAGES, not sections: the header links them and no section is drawn (D7).
  # The docs product keeps its key, its uptime and analytics slugs and its `added:` — only its card
  # leaves the Build grid.
  - id: docs
    kind: page
    emoji: "📖"
    title: Docs
    url: https://calcofi.io/docs/
  - id: news
    kind: page
    emoji: "🗞"
    title: News
    url: /news/

