# Products shown on calcofi.io. One card per product; `section` controls
# placement. Cards are named for the thing itself — the repo or app name used
# everywhere else (db-viz-hex, not "Integrated App") — so a card, its source,
# its status page and its usage report are obviously the same product. Student
# contributions keep human-friendly titles.
#
# Canonical app URLs follow uptime/.upptimerc.yml (https://app.calcofi.io/<app>/).
#
# status:       active (default, no badge) | interim | superseded | archived
# superseded_by: key of the replacing product (renders "superseded by <link>")
# extra_links:  [{label, url}] — extra deep links in the card's link row
# credits:      {org, year, team[]} — shown on student contributions

sections:
  - id: apps
    emoji: "🔭"
    featured: true
    title: Apps — by Spatial Unit
    blurb: >-
      Explore the whole integrated database, each app summarizing by a
      different spatial unit — station, hexagon, cruise, or contour.
  - id: apps-dataset
    emoji: "🎯"
    featured: true
    title: Apps — Dataset-Specific
    blurb: >-
      Apps focused on a single dataset or data source.
  - id: services
    emoji: "☁️"
    title: Services
    blurb: >-
      Hosted endpoints serving the data directly — standards-based access and
      public cloud storage.
  - id: developer
    emoji: "🛠"
    title: Developer
    blurb: >-
      R packages with documented functions, browser-based query and schema
      tools, and the reproducible workflows behind every release.
  - id: documentation
    emoji: "📖"
    title: Documentation
    blurb: >-
      How the data ecosystem works, and the server stack it runs on.
  - id: students
    emoji: "🎓"
    title: Student Contributions
    blurb: >-
      Capstone and fellowship projects by university students partnering with
      CalCOFI.

products:

  # ── apps ─────────────────────────────────────────────────────────────────
  - key: ctd-transects
    title: CTD Transects
    uptime: ctd-transects
    usage: ctd-transects
    section: apps-dataset
    live_url: https://calcofi.io/ctd-transects/
    source_url: https://github.com/CalCOFI/ctd-transects
    img: images/ctd-transects.jpg
    description: >-
      Cross-shelf temperature, salinity, oxygen, density and fluorescence
      sections along every CalCOFI line, for every cruise since 1993 — drawn
      nearshore to offshore with no station picking, and mapped so you can see
      where each transect is. Flags each cruise's processing stage, and shows
      the uncorrected sensor series on cruises whose bottle merge has not run.
    tech: [DuckDB, Plotly, JavaScript]

  - key: db-viz-station
    title: Station Explorer
    uptime: db-viz-station
    usage: db-viz-station
    section: apps
    live_url: https://app.calcofi.io/station/
    source_url: https://github.com/CalCOFI/db-viz-station
    img: images/ucsb-station-portal.png
    description: >-
      Discover what's measured at each CalCOFI station — station × dataset
      coverage (time, depth, observations, surveys) built from the integrated
      release database, with variable search and dataset crosswalk. Continues
      the 2026 UCSB student capstone.
    tech: [DuckDB, JavaScript, MapLibre]

  - key: db-viz-hex
    title: Hexagon Explorer
    uptime: db-viz-hex
    usage: db-viz-hex
    section: apps
    live_url: https://app.calcofi.io/hex/
    source_url: https://github.com/CalCOFI/db-viz-hex
    img: images/db-viz-hex.png
    description: >-
      Explore decades of fish larvae and oceanographic bottle data together —
      filter by taxa, depth and season over dynamic hexagon maps, time series
      and depth profiles.
    tech: [R, Shiny, DuckDB, H3, MapLibre]

  - key: db-viz-cruise
