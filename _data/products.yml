# Products shown on calcofi.io. One card per product; `section` controls
# placement. Cards are named for the thing itself — the repo or app name used
# everywhere else (db-viz-hex, not "Integrated App") — so a card, its source,
# its status page and its usage report are obviously the same product. Student
# contributions keep human-friendly titles.
#
# Canonical app URLs follow uptime/.upptimerc.yml (https://app.calcofi.io/<app>/).
#
# status:       active (default, no badge) | interim | superseded | archived
# superseded_by: key of the replacing product (renders "superseded by <link>")
# extra_links:  [{label, url}] — extra deep links in the card's link row
# shots:        themed — the product honours ?theme= and has images/<key>_{dark,light}.png
#               (img: then just names the dark one as a fallback)
#               (scripts/shots.py); the card swaps them with the site's theme toggle
# credits:      {org, year, team[]} — shown on student contributions
# group:        an eyebrow group inside a section (Explore's `across` / `one`), from sections[].groups
# datasets:     the dataset_keys this product covers — a list, or `all` (every dataset in the
#               release record). Validated at build against _data/datasets.json's datasets[] and
#               holdings[]: an unknown key FAILS the build (plan D-2). It is also the reverse index
#               behind each dataset page's Access > Explore rows, so this is the ONE place a
#               product-to-dataset link is written.

sections:
  - id: datasets
    emoji: "🗂"
    title: Datasets
    blurb: >-
      Find what has been collected. One record per dataset — coverage, every endpoint it can be
      reached through, its licence and how to cite it — by category, with the holdings CalCOFI has
      but has not ingested yet.
  - id: explore
    emoji: "🔭"
    featured: true
    title: Explore
    groups:
      - id: across
        title: Across datasets
        blurb: >-
          The Explorer brings the spatial grains together as lenses in one app; the others each go
          deep on one grain — station, hexagon, cruise, or contour.
      - id: one
        title: One dataset
        blurb: >-
          Apps focused on a single dataset or data source.
    blurb: >-
      Explore CalCOFI data in the browser — across every ingested dataset, or deep on one.
  - id: access
    emoji: "☁️"
    title: Access
    blurb: >-
      The ways to get the data: standards-based services, public cloud storage, browser SQL, and
      the R and Python packages that read a release directly.
  - id: build
    emoji: "🛠"
    title: Build
    blurb: >-
      The pipeline behind every release and the documentation tying it together — the ingest
      workflows, the database tooling, the schema browser and the technical docs.
  - id: students
    emoji: "🎓"
    title: Students
    blurb: >-
      Capstone and fellowship projects by university students partnering with CalCOFI.

products:

  # ── explore · across datasets ────────────────────────────────────────────

  - key: explore
    title: CalCOFI Explorer
    uptime: explore
    usage: explore
    section: explore
    group: across
    datasets: all
    live_url: https://calcofi.io/explore/
    # dataset_url: the deep link a dataset page builds for this product — {key} is the dataset_key.
    # This is the ONE place a product-to-dataset link is written (UI plan Decision 10); a product
    # with no template gets a row that says it opens the app, not the dataset.
    dataset_url: https://calcofi.io/explore/?datasets={key}
    source_url: https://github.com/CalCOFI/explore
    img: images/explore_dark.png   # fallback; the card shows the _dark/_light pair
    shots: themed
    extra_links:
      - label: Hexagons
        url: https://calcofi.io/explore/?lens=hex&res=5
      - label: Sections
        url: https://calcofi.io/explore/?lens=section&var=temperature&line=90
    description: >-
      One app, five lenses — stations, hexagons, cruises, regions and sections — for one
      organism or one ocean variable at a time over the frozen release. The queries run in your
      browser (no server), every view is a URL you can share, every download carries its SQL, and
      feedback comes with an annotated screenshot.
    tech: [DuckDB-WASM, TypeScript, MapLibre, deck.gl, Plotly]

  - key: db-viz-station
    title: Station Explorer
    uptime: db-viz-station
    usage: db-viz-station
    section: explore
    group: across
    datasets: all
    live_url: https://app.calcofi.io/station/
    dataset_url: https://app.calcofi.io/station/?dataset={key}
    source_url: https://github.com/CalCOFI/db-viz-station
    img: images/db-viz-station_dark.png   # fallback; the card shows the _dark/_light pair
    shots: themed
    description: >-
