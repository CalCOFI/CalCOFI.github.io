    source_url: https://github.com/CalCOFI/ctd-transects
    img: images/ctd-transects_dark.png   # fallback; the card shows the _dark/_light pair
    shots: themed
    description: >-
      Cross-shelf temperature, salinity, oxygen, density and fluorescence
      sections along every CalCOFI line, for every cruise since 1993 — drawn
      nearshore to offshore with no station picking, and mapped so you can see
      where each transect is. Opens on the anomaly against each station's
      day-of-year climatology (warmer or colder than usual, and by how much),
      with the measured value one click away. Flags each cruise's processing
      stage, and shows the uncorrected sensor series on cruises whose bottle
      merge has not run.
    tech: [DuckDB, Plotly, JavaScript]

