    uptime: db-viz-cruise
    usage: db-viz-cruise
    section: apps
    live_url: https://app.calcofi.io/cruise/
    source_url: https://github.com/CalCOFI/apps/tree/main/db-viz-cruise
    img: images/db-viz-cruise.png
    description: >-
      Cross-dataset observation explorer — compare coverage across cruises,
      datasets and depths, with shareable deep-link URLs.
    tech: [R, Shiny, DuckDB]

  - key: ctd-viz
    title: CTD Explorer
