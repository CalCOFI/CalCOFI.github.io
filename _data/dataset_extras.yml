# Words for people browsing the datasets that the release record does not carry (yet).
# Read by _plugins/dataset_extras.rb into the Browse datasets tiles and rows and each dataset page.
#
# Betty, 2026-11-18. DRAFTS written from each dataset's own description in the release record:
# confirm with Ben and the data providers before relying on them. Anything left out (or blank)
# is simply not drawn — nothing here is required, and nothing is guessed at build time.
#
#   plain       a name people recognise, shown above the record's own short name
#   collection  how the samples or readings were collected
#   analysis    how they were analysed (method), and by whom (lab): "<method> (<lab>)"
#   method      the collection-method picture: net · pump · ctd · bottle · ship · eye · calc
#   citation    the citation as the provider gives it, used only while the release record has no citation_main
#   status      ongoing · archived (shown as "Ended"; blank: not stated anywhere yet, so no label)
#   lede        the sentence under the title on the dataset page, when the record's own first sentence is cut short
#   more        what "More about the record" opens: only what a reader needs (caveats, grain, provenance). A dataset listed
#               here with no `more` has no "More about the record" at all, so notes for the data team never reach the page.
#   blurb       a short description for the row; without it, the record's first sentence (the second too when the first is
#               short), minus notes for the data team such as "(see questions …)"
#
# `tiles` sets the category tiles on /datasets/: Environment first, then Biology. A tile lists the
# record categories it holds (`categories`) or individual datasets (`datasets`); its `line` is the
# one "what's in it" line on the tile; `about` (Betty 2026-11-19) the fuller description shown when the tile is opened,
# DRAFTED from its datasets' own record descriptions like the rest of this file: confirm with Ben and the providers.

tiles:
  - realm: env
    title: Environment
    sub: Temperature, salinity, chemistry and weather at sea
    groups:
      - name: CTD & Bottle
        icon: cat-physical
        line: Temperature, salinity, oxygen, nutrients and chlorophyll by depth
        about: "Measurements of the water column at CalCOFI stations since 1949. Bottle samples from the rosette give temperature, salinity, oxygen, nutrients, pigments and C14 at set depths; CTD casts give sensor profiles (temperature, salinity, oxygen, fluorescence and more) binned to 1 m. Two derived datasets add values computed from them, such as spice, mixed-layer depth, the chlorophyll maximum and where oxygen falls to hypoxic levels."
        datasets: [calcofi_ctd-cast, calcofi_bottle, calcofi_ctd-derived, calcofi_bottle-derived]
      - name: Carbonate Chemistry
        icon: cat-carbonate
        line: Dissolved inorganic carbon (DIC), alkalinity and dissolved iron
        about: "Dissolved inorganic carbon (DIC) and total alkalinity from CalCOFI Niskin bottle samples, quality-controlled with WOCE flags, and surface dissolved iron measured on CalCOFI cruises from November 2002 to July 2004."
        datasets: [calcofi_dic, cce-lter_iron]
      - name: Underway Weather & Surface Water
        icon: cat-meteorology
        line: Weather and surface water every minute along the ship’s track
        about: "Surface water temperature and salinity from the ship’s thermosalinograph (TSG), with weather, recorded about once a minute continuously along the cruise track."
        datasets: [calcofi_mets]
  - realm: bio
    title: Biology
    sub: Fish eggs and larvae, plankton, krill, seabirds, marine mammals and eDNA
    groups:
      - name: Fish Eggs & Larvae
        line: Eggs and larvae from net tows and the ship’s pump
        about: "Fish eggs and larvae from bongo and manta net tows on CalCOFI cruises, counted by NOAA SWFSC, and egg counts (sardine, anchovy, jack mackerel, hake, squid) from the ship’s Continuous Underway Fish Egg Sampler (CUFES) since 1996. A tow with nothing in it is kept as a true zero."
        categories: [Fish Eggs & Larvae]
      - name: Phytoplankton
        line: Counts by species or group
        about: "Abundance and species composition of phytoplankton (385 taxonomic categories), 1996–2022, counted by inverted microscope (E. Venrick). Near-surface samples are pooled into four regions before counting, so the counts are by cruise and region, not by station."
        categories: [Phytoplankton]
      - name: Euphausiids (Krill)
        line: Species and life stages from net tows
        about: "Krill abundance by species and life stage from CalCOFI / CCE-LTER net tows, 1951 to the present: one row per tow, species and stage. Units are provisional until the provider confirms them."
        categories: [Euphausiids (Krill)]
      - name: Zooplankton
        line: Counts, carbon and size from net tows
        about: "Zooplankton from CalCOFI net tows, from several sources: counts and carbon for 33 higher taxa by microscopy (ZooDB, 1951–2021), abundance, carbon and size from ZooScan imaging (2005 to the present), spiny lobster larvae (1951–2008), Dungeness crab megalopae examined for CDFW, and the SIO Pelagic Invertebrate Collection’s register of tows."
        categories: [Zooplankton]
      - name: Picoplankton & Bacteria
        line: Cell counts by flow cytometry
        about: "Prochlorococcus, Synechococcus, picoeukaryotes and heterotrophic bacteria counted by flow cytometry, 2004–2023 (ongoing), from seawater at 3–8 depths per station on CCE-CalCOFI Augmented cruises."
        categories: [Picoplankton & Bacteria]
      - name: Seabirds & Marine Mammals
        line: Counts along the cruise track
        about: "Seabird and marine mammal counts along CalCOFI (and NMFS, CPR) cruise transects since 1987, with the survey effort behind them."
        categories: [Seabirds & Marine Mammals]
      - name: Mesopelagic Fish
        line: Catches from midwater trawls
        about: "Counts of 90 named mesopelagic fish species from midwater (MOHT) trawls on 7 CalCOFI cruises, 2010–2012, all on RV New Horizon."
        categories: [Mesopelagic Fish]
      - name: Genomics & eDNA
        line: DNA detected in seawater
        about: "Vertebrate eDNA from water filters collected on the October 2022 CalCOFI cruise: whales and dolphins from one assay, fish from another (12S MiFish). Read counts are a rough signal, not abundance, and only detections are published."
        categories: [Genomics & eDNA]

datasets:
  swfsc_ichthyo:
    more: "A tow with no egg, larva or invertebrate record is a true zero: it stays as a sample with its effort, and abundance rows are positive only. Counts of species codes that share a WoRMS AphiaID are summed per net. A tow’s maximum depth is SWFSC’s NetDepth, an estimate of the net’s depth when all wire is out, not a measured depth. Egg stages 12–15 are removed at source. MOCNESS tows are not included."
    plain: Fish Egg and Larva Counts
    collection: Bongo and manta net tows on CalCOFI cruises
    analysis: Visual microscopy (CalCOFI, NOAA SWFSC)   # method to confirm with SWFSC
    method: net
    status: ongoing        # Betty’s CalOOS list: ongoing
    citation_override: "Southwest Fisheries Science Center, 2026: CalCOFI Database. NOAA National Centers for Environmental Information, https://www.fisheries.noaa.gov/inport/item/20691."
    license: CC0-1.0   # Betty 2026-11-21: public domain (CC0), free use and reuse (the release states none here)
    creators_override:   # Betty 2026-11-21
      - name: Noelle Bowlin
        organization: NOAA SWFSC
    data_provider:       # Betty 2026-11-21
      name: Ed Weber
      email: ed.weber@noaa.gov
  swfsc_cufes:
    more: "Sampling is ongoing; the processed record reaches April 2022. Squid eggs are Abraliopsis felis, the only squid in the region with pelagic eggs."
    plain: Fish Egg Counts from the Ship’s Underway Pump
    collection: Underway pump (CUFES) on CalCOFI cruises
    analysis: Visual microscopy (CalCOFI, NOAA SWFSC)
    method: pump
    status: ongoing        # "Sampling is ongoing" (record description)
    citation: "Southwest Fisheries Science Center, 2026: Continuous Underway Fish-Egg Sampler (CUFES) Database. NOAA National Centers for Environmental Information, https://www.fisheries.noaa.gov/inport/item/20692."
    license: CC0-1.0   # Betty 2026-11-21: same as ichthyoplankton
    creators_override:   # Betty 2026-11-21
      - name: Noelle Bowlin
        organization: NOAA SWFSC
    data_provider:       # Betty 2026-11-21
      name: Ed Weber
      email: ed.weber@noaa.gov
  calcofi_phytoplankton:
    lede: "Abundance and species composition of phytoplankton (385 taxonomic categories) in the California Current, 1996–2022, by inverted-microscope counts (E. Venrick)."
    more: "Samples from the near-surface “second depth” are pooled across stations into four regions (NE, SE, Alley, Offshore; Hayward & Venrick 1998) before counting, so each row is a cruise and region, not a station. Source: EDI knb-lter-cce.254.4."
    plain: Phytoplankton Counts by Species
    map_note: No stations, pooled into 4 regions
    collection: Near-surface water samples, pooled into four regions
    analysis: Visual microscopy (CalCOFI)
    who: Elizabeth Venrick
    method: bottle
    status: archived        # Betty’s CalOOS list: archived
    # Measurements table (a biology dataset's; an environmental one's comes from measurements.json): name = the value in measurement_type.
    # Units are the download's own label. The source (EDI knb-lter-cce.254.4) says cells/100 ml and the values look unconverted, so the label is
    # probably wrong; change it here once the data team settles it (drafts/request_phytoplankton_units-and-missing-codes.md).
    measurements:
      - name: phytoplankton_abundance
        units: cells/L
        desc: "Abundance of a phytoplankton taxon in water pooled from about 5–15 m deep. Individual 30 ml samples from 34 stations are pooled into four regions (NE, SE, Alley, Offshore) before counting with an inverted phase-contrast microscope, so each value is per cruise and region, not per station. Zero means the taxon was not seen."
  cce-lter_euphausiids:
    more: "Units are provisional until the provider confirms them."
    plain: Krill Counts by Species and Life Stage
    collection: Net tows on CalCOFI / CCE-LTER cruises
    analysis: Visual microscopy (CCE-LTER)
    who: Mark Ohman
    method: net
    status: ongoing        # "1951-present" (record description)
    ack_override: "Data originate from the Brinton and Townsend Euphausiid Database of the Pelagic Invertebrate Collection, Scripps Institution of Oceanography. Supported in recent years by NSF grants to M.D. Ohman and the CCE-LTER site."
  calcofi_phyllosoma:
    more: "Source: EDI knb-lter-cce.188.4 (Koslow)."
    plain: Spiny Lobster Larva Counts
    collection: Net tows on CalCOFI cruises
    analysis: Visual microscopy (CalCOFI)
    who: J. Anthony Koslow
    method: net
    status: archived        # Betty’s CalOOS list: archived
  cce-lter_zooscan:
    lede: "Zooplankton abundance, carbon biomass and size (Feret diameter, individual carbon content) from ZooScan optical imaging of CalCOFI / CCE-LTER PRPOOS net tows on lines 80, 87 and 90, 2005 to present, machine-classified into 23 bioclasses."
    more: "The bioclasses include copepod groups, euphausiids, chaetognaths, appendicularians, salps, doliolids, pteropods and rhizaria. Tows are per station. Source: SIO Ocean Informatics ZooScan portal (Ohman Lab; interface by Marina Frants)."
    plain: Zooplankton Counts, Carbon and Size from Scanned Images
    collection: PRPOOS net tows on lines 80, 87 and 90
    analysis: Optical scanner (CCE-LTER)
    who: Mark Ohman
    method: net
    status: ongoing        # "2005-present" (record description)
    ack_override: "Plankton sample analysis supported by NSF grants to M.D. Ohman and the CCE-LTER site."
  cce-lter_zoodb:
    lede: "Holoplankton abundance and carbon biomass by 33 higher taxa (copepods to family, plus amphipods, chaetognaths, salps, pyrosomes, pteropods, ostracods, foraminifera, radiolaria and more) from CalCOFI net tows, 1951–2021, enumerated by microscopy (Ohman Lab, SIO Pelagic Invertebrate Collection)."
    more: "Unpooled tows are station-resolved; pooled samples are per-cruise regional composites. Abundance is raw (uncorrected), per 1000 m³ and per m², plus biomass in mg C per m²."
    plain: Zooplankton Counts and Carbon by Group
    collection: Net tows on CalCOFI cruises
    analysis: Visual microscopy (CCE-LTER)
    who: Mark Ohman
    method: net
    status: ongoing        # Betty’s CalOOS list: ongoing
    ack_override: "Plankton sample analysis supported by NSF grants to M.D. Ohman, Scripps Institution of Oceanography and by the SIO Pelagic Invertebrates Collection."
  sio_pic-zooplankton:
    more: "Includes the historical grid (1950s–80s inshore, Gulf of California and Baja lines), not just the modern pattern. Biovolume is not in the source file yet."
    plain: "Zooplankton Net Tow Log: Where and When Each Tow Was Made"
    collection: Net tows in the SIO Pelagic Invertebrate Collection
    analysis: Tow registry, no counts yet (SIO)
    method: net
  cdfw_dungeness-crab:
    more: "Only samples that were examined are published. Counts are occurrences in the examined aliquot, not standardized density. Sorting was done at the SIO Pelagic Invertebrate Collection, where the removed megalopae are archived in vials."
    plain: Dungeness Crab Larva Counts
    collection: Archived CalCOFI net tow samples
    analysis: Visual microscopy, sorted and counted (CDFW)
    who: Laura Rogers-Bennett
    blurb: Dungeness crab (Metacarcinus magister) megalopae counted in archived CalCOFI net tow samples, sorted by CDFW staff at the Scripps Pelagic Invertebrate Collection. 216 tows were checked for megalopae (cruise years 1984–2009), then 310 April tows counted (2008–2014).
    source_url: https://library.ucsd.edu/dc/collection/bb8788170v
    source_label: UC San Diego Library
    method: net
    status: archived        # Betty’s CalOOS list: archived
    data_provider:       # Betty 2026-11-21
      name: Christy Juhasz
      organization: California Department of Fish and Wildlife (CDFW)
      email: christy.juhasz@wildlife.ca.gov
  cce-lter_picoplankton-bacteria:
    more: "Seawater is collected from Niskin bottles at 3–8 depths per station; cells are fixed on board with paraformaldehyde, stained with a DNA-specific dye and counted on an Altra flow cytometer."
    plain: Counts of the Smallest Phytoplankton and Bacteria
    collection: Water bottles at 3 to 8 depths per station
    analysis: Flow cytometry (CCE-LTER)
    who: Michael Landry
    method: bottle
    status: ongoing        # "2004-2023 (ongoing)" (record description)
  farallon_bird-mammal:
    plain: Seabird and Marine Mammal Sightings
    collection: Visual strip transects along the cruise track
    analysis: Visual observation (Farallon Institute)
    who: Bill Sydeman
    method: eye
    status: ongoing        # "1987-present" (record description)
    # the attribution statement the Farallon Institute's data sharing agreement (23 July 2025) asks users to include
    ack_override: "This [product] uses data collected by the Farallon Institute, U.S. National Oceanic and Atmospheric Administration’s (NOAA) Integrated Ocean Observing System (IOOS) with funding distributed to the Southern California Coastal Ocean Observing System (SCCOOS), and the U.S. National Science Foundation’s (NSF) California Current Ecosystem Long Term Ecological Research (CCE LTER) site under Grant No. OCE 2142918 (and earlier awards). Earlier financial and organizational support for these seabird observations was also provided through generous gifts from the National Fish and Wildlife Foundation, Moore Family Foundation, Packard Foundation, and Point Blue Conservation Science. For use of the CalCOFI dataset, we acknowledge data originators and PIs Richard R. Veit, K. David Hyrenbach, and William J. Sydeman. For use of the RREAS dataset, we acknowledge data originator and PI William J. Sydeman, and NOAA NMFS Santa Cruz Laboratory for collaboration."
    citation: "Sydeman, W. J., Veit, R. R., & Hyrenbach, K. D. (2025). CalCOFI Farallon Institute Seabirds [Dataset]. Farallon Institute. NOAA ERDDAP. https://oceanview.pfeg.noaa.gov/erddap/tabledap/CAC_FI_SBAS_tr.html"   # drafted by Betty + Claude 2026-11-20 (APA) because the provider gave none; year, authors and title to confirm with Farallon
    sources_inline: true      # Original data links Observations and Transects directly; no "Combined from 2 source tables" box
    creator_org: Farallon Institute   # the agreement names only the Institute as collector; the record adds "& UCSD SIO"
    licence_note: The data are CC BY 4.0.
    agreement_url: https://oceanview.pfeg.noaa.gov/CalCOFI/app/resources/docs/Data_Sharing_Agreement_FarallonInstitute.pdf
    agreement_label: Data sharing agreement (PDF)
  sio_mesopelagic-fish:
    plain: Midwater Fish Catches by Species
    collection: Midwater trawl (MOHT) tows, 7 cruises in 2010 to 2012
    analysis: (SIO)
    who: J. Anthony Koslow
    more: "All fishes were collected with a MOHT trawl. Volume filtered was estimated from calibrated TSK flowmeter readings. The fish collection methods are described in the papers below."
    refs:
      - label: Oozeki et al. 2004 (the MOHT trawl)
        url: https://doi.org/10.1111/j.1444-2906.2003.00795.x
      - label: Davison et al. 2013 (how the fish were collected)
        url: https://doi.org/10.1016/j.pocean.2013.05.013
    method: net
    status: archived        # Betty’s CalOOS list: archived
  calcofi_2022-edna:
    more: "Water filters from CalCOFI/GEMCAP stations off Southern California were run through a mitochondrial D-loop assay (cetacean detections) and a 12S rRNA “MiFish” assay (fish detections). Sequence read counts are a rough signal of PCR-amplified DNA, not abundance, and are not comparable between the two assays. Only detections are published, so a missing row for a filter and taxon does not mean the taxon was absent. Published on GBIF/OBIS as an intercalibration exercise, linked to Patin et al. 2026 (Methods in Ecology and Evolution)."
    plain: Fish, Whale and Dolphin DNA in Seawater (Oct 2022)
    collection: Seawater filtered at stations on the October 2022 cruise
    analysis: eDNA metabarcoding, D-loop and 12S MiFish assays (CalCOFI-UCSD SIO)
    who: Nastassia Patin; Garret O’Donnell
    method: bottle
  calcofi_bottle:
    more: "The provider publishes two linked files: casts (one row per hydrographic cast: date, position, weather and bottom depth) and bottles (one row per bottle depth). These casts are not the CTD Cast Files dataset, although both come from the same station visit."
    plain: "Water Samples: Temperature, Salinity, Oxygen, Nutrients"
    collection: 10-liter Niskin bottles on a 24-place CTD-Rosette
    analysis: Laboratory analyses of water samples (CalCOFI)
    who: Rasmus Swalethorp
    creators:          # the release names no creator for this dataset (Betty 2026-11-21); as it does for CTD Cast Files
      - name: Rasmus Swalethorp
        organization: UCSD SIO
        email: rswalethorp@ucsd.edu
    blurb: Water-sample measurements from CalCOFI cruises since 1949 — temperature, salinity, oxygen, chlorophyll, nutrients and 14C primary productivity, each with a quality code.   # from the provider’s Bottle Database page (Betty 2026-11-20)
    method: bottle
    status: ongoing        # Betty’s CalOOS list: ongoing
    field_hide: [scientific_name, taxon_key, life_stage, tow_type]
    field_notes:
      cruise_key: "CalCOFI cruise, as year-month-ship code (YYYY-MM-NODC). Cruise_ID in the original cast file."
      line: "CalCOFI line number: the first number of site_key, for example 090.0."
      station: "CalCOFI station number along the line: the second number of site_key, for example 060.0."
      site_key: "CalCOFI line and station of the cast the bottle was tripped on, for example 090.0 060.0 (Sta_ID in the original bottle file)."
      depth_min_m: "Depth of the bottle, in metres (Depthm in the original bottle file)."
      depth_max_m: "Depth of the bottle, in metres (Depthm in the original bottle file)."
      measurement_type: "Which bottle quantity the row is, for example btl_temperature, salinity_btl or btl_nitrate. Each is described, with its units, under Measurements below and in measurement_type.csv."
      sample_type: "What one row of sample.csv is. In this dataset, a bottle."
    citation_override: "Scripps Institution of Oceanography, UC San Diego, 2026. CalCOFI Hydrographic CTD Bottle Data. https://calcofi.org/data/oceanographic-data/bottle-database/"   # as the provider gives it (Betty 2026-11-20)
  calcofi_ctd-cast:
    license: CC-BY-4.0   # Betty 2026-11-21: CC BY 4.0 for Rasmus Swalethorp’s CTD and bottle datasets (the release states none here)
    more: "The CTD is a Sea-Bird SBE 911plus, surrounded by a rosette of 24 10-liter Niskin bottles. Final 1 m-binned data for 1993–2002 come from the SIO-CalCOFI Technical Group’s own archive (J. Wilkinson), which covers the decade calcofi.org does not publish finals for; 1998 and 2003 onward come from calcofi.org. Where both publish the same cruise, calcofi.org is used."
    plain: "Sensor Profiles by Depth: Temperature, Salinity, Oxygen"
    collection: CTD sensor package on a 24-bottle rosette, lowered at each CalCOFI station
    analysis: Sensor measurements, binned to 1 m (CalCOFI)
    blurb: Water-column profiles from the CTD sensors, at 1 m resolution (the bottle database is about 10 to 100 m) — temperature, salinity, dissolved oxygen, fluorescence/chlorophyll-a, nitrate and more.   # from the provider’s CTD Cast Files page (Betty 2026-11-21)
    refs:
      - label: CTD-Rosette cast
        url: https://wp.calcofi.org/wp/ctd-rosette-cast/
      - label: CTD / Bottle sampling methods
        url: https://wp.calcofi.org/wp/data/sampling-info/methods/bottle-sampling-methods/
    who: Rasmus Swalethorp
    method: ctd
    status: ongoing        # runs to 2026 and is still being added to
    field_hide: [scientific_name, taxon_key, life_stage, tow_type]
    field_notes:
      line: "CalCOFI line number: the first number of site_key, for example 090.0."
      station: "CalCOFI station number along the line: the second number of site_key, for example 060.0."
      datetime: "Date and time (UTC) of the cast. In CalCOFI’s original cast file (Date, Time), the time is when the CTD reached its terminal depth."
      latitude: "Observed latitude of the cast, in decimal degrees (Lat_Dec in the original cast file)."
      longitude: "Observed longitude of the cast, in decimal degrees (Lon_Dec in the original cast file)."
      cruise_key: "CalCOFI cruise, as year-month-ship code (YYYY-MM-NODC). Cruise_ID in the original cast file."
      site_key: "CalCOFI line and station of the cast, for example 090.0 060.0 (Sta_ID in the original cast file)."
      depth_min_m: "Shallowest depth of the reading, in metres. The CTD profile is binned to 1 m."
      depth_max_m: "Deepest depth of the reading, in metres. The CTD profile is binned to 1 m."
      measurement_type: "Which CTD quantity the row is, for example temperature_ave, salinity_ave_corr or oxygen_ml_l_ave_cruise_corr. There are 44: sensors 1 and 2, their average, cruise- or station-corrected versions, bottle values and sensor-based estimates. Each is described, with its units, under Measurements below and in measurement_type.csv."
      sample_type: "What one row of sample.csv is. In this dataset, a CTD cast."
      measurement_value: "The reading, in the units given in the units column. Corrected, averaged and estimated quantities are explained in measurement_type.csv."
      measurement_qual: "The CTD team’s flag for the reading, as published: 0 good, 1 use the primary sensor, 2 use the secondary sensor, 4 below detection limit (reported as 0), 8 questionable, 9 bad or missing. Blank means 0."
      units: "Units of measurement_value, copied from measurement_type.csv."
      sample_key: "The cast this reading came from, calcofi_ctd-cast:cast:… Joins sample.csv."
      grid_key: "CalCOFI station grid cell the cast falls in."
      obs_id: "Row number of the reading. Renumbered with every release, so do not rely on it across releases."
      realm: "env on every row here: physical and chemical measurements, no organisms."
      dataset_key: "calcofi_ctd-cast on every row."
      order_occ: "Order in which the station was occupied on the cruise (Order_Occ in the original cast file)."
      data_stage: "final, or preliminary while a cruise’s calibrations are not yet applied."
    citation_override: "Scripps Institution of Oceanography, UC San Diego, 2026. CalCOFI Hydrographic CTD Cast Profile Data. https://calcofi.org/data/oceanographic-data/bottle-database/"   # as the provider gives it (Betty 2026-11-20)
  calcofi_ctd-derived:
    field_notes:
      cruise_key: "CalCOFI cruise, as year-month-ship code (YYYY-MM-NODC). Cruise_ID in the original cast file."
      site_key: "CalCOFI line and station, for example 090.0 060.0 (Sta_ID in the original files)."
      line: "CalCOFI line number: the first number of site_key, for example 090.0."
      station: "CalCOFI station number along the line: the second number of site_key, for example 060.0."
    license: CC-BY-4.0   # Betty 2026-11-21: CC BY 4.0 for Rasmus Swalethorp’s CTD and bottle datasets (the release states none here)
    lede: "Hydrographic products derived from the CalCOFI CTD cast profiles rather than measured: spiciness and sigma-theta at every published CTD depth, and, per cast, the mixed-layer depth, chlorophyll-a maximum and integral, hypoxic boundary depths, nitracline depth and pycnocline depth."
    more: "Mixed-layer depth follows the CalCOFI legacy definition, with two alternative criteria beside it. The hypoxic boundaries are where oxygen falls to 2.4, 1.4 and 0.5 mL/L; the nitracline is where nitrate reaches 1 µmol/L; the pycnocline is the maximum of the buoyancy frequency (N²). Everything is computed from the full-resolution 1 m bins of the CTD Cast Files after the provider’s quality flags are applied, by the definitions of the CalCOFI CTD team."
    plain: "Calculated from Sensor Profiles: Mixed-Layer Depth, Low-Oxygen Depths, Spiciness"
    collection: Calculated from the CTD Cast Files
    analysis: TEOS-10 for spiciness and density; CalCOFI’s definitions for the mixed-layer, low-oxygen, nitracline and pycnocline depths (CalCOFI)
    who: Rasmus Swalethorp
    creators:          # the release names no creator for this dataset (Betty 2026-11-21)
      - name: Rasmus Swalethorp
        organization: UCSD SIO
        email: rswalethorp@ucsd.edu
    method: calc
    status: ongoing        # derived from the CTD Cast Files, so it runs to 2026 too
    blurb: Values worked out from the CTD profiles, not measured. Per depth, spiciness and density; per cast, the mixed-layer, chlorophyll-maximum, low-oxygen, nitracline and pycnocline depths.
  calcofi_bottle-derived:
    field_notes:
      cruise_key: "CalCOFI cruise, as year-month-ship code (YYYY-MM-NODC). Cruise_ID in the original cast file."
      site_key: "CalCOFI line and station, for example 090.0 060.0 (Sta_ID in the original files)."
      line: "CalCOFI line number: the first number of site_key, for example 090.0."
      station: "CalCOFI station number along the line: the second number of site_key, for example 060.0."
    lede: "Hydrographic values derived from the CalCOFI Bottle Database rather than measured: spiciness (at 0 dbar) and the TEOS-10 sigma-theta at every bottle with a temperature and a salinity, and, per cast, the nitracline depth."
