# The ship's log — the HAND-WRITTEN rows (plan 2026-09-07 § D-5). Everything else in the log is
# generated by _plugins/news.rb: releases from _data/versions.json, datasets entering the release
# from the record's since_version, apps from products.yml `added:`. Write a row here for what the
# data cannot say — a feature, a change to the site, a paper.
#
#   date:   YYYY-MM-DD
#   type:   story | tutorial | data | site | paper   (release · dataset · app are generated; a row with `version:` or
#           `dataset_key:` OVERRIDES the generated entry of that key — for a wrong since_version or a
#           notes heading that is not the story)
#   title:  one line, declarative
#   body:   one or two sentences
#   url:    where to read more (a story: its page under /stories/; a tutorial: under /tutorials/)
#
# A STORY is something the data show (a cruise's finding, a film made from the release), where every other type
# is about the system. It is the first chip on /news/, so it is not lost among the release notes. A TUTORIAL is a
# recorded walk-through, dated the day it was given: its page holds the recording, the slides, notes and scripts,
# and a summary of what was shown and heard. It is the second chip.
#
# Types are quiet chips, none is yellow: --warn marks a state that needs attention, never a kind of
# thing. Dates below are from RELEASES.md and the repos' merge dates.
#
# A row that links the changelog links a HEADING in it, not the top of the page: the rendered
# RELEASES.html stamps a slug id on every `##` (`#one-climatology-for-every-anomaly`) and the version
# string itself on each version heading (`#v2026.09.06`). scripts/check_news.py GETs that page once
# after a build and fails on a fragment it cannot find, so an anchor cannot rot unnoticed.

- date: 2026-11-17   # the day PR #45 was reconciled; set this to the day it is merged
  type: site
  title: "A new front door: three ways to start, and a finder for every catalog"
  body: "The first screen asks where you want to start: see the data on a map, download a dataset, or pull exactly the rows you need. Datasets, species and measurements each open as a searchable list with a preview beside it, and every dataset page leads with what is in it and one Download button."
  url: https://calcofi.io/

- date: 2026-11-16
  type: story
  title: "The warmest fall ocean in CalCOFI's record"
  body: "The fall 2026 cruise found the upper 50 m off Southern California 4.4 °C (7.8 °F) above the 1993–2013 fall average, and 11.9 °C (21.3 °F) above it at 50–60 m off San Diego: the largest departures since 1949, far above the 2014–2016 Blob and El Niño. A 35-second film, in °C, °F or both. Preliminary data."
  url: /stories/elnino-2026/

- date: 2026-11-12
  type: tutorial
  title: "A tour of the CalCOFI.io database"
  body: "The recorded tour of 12 November: calcofi.io, the Explorer and CTD transects, how the tables fit together, and the data in R and Python. With the slides, the notes, the scripts and what attendees asked for."
  url: /tutorials/db-tour-2026-11/

- date: 2026-09-07
  type: site
  title: "The front door shows the ship, the water and the years"
  body: "Line 90 drawn as a section — the ship, its gear to depth, one pin per data category — with the station grid and every dataset's measured years under it. Every colour is a brand token; every number is read from the release."
  url: https://calcofi.io/

- date: 2026-09-06
  type: app
  key: explore-calm
  title: "Explorer: the calm layout is live"
  body: "Floating panels you can move, collapse and resize; the title sentence is the query; every view is a URL you can share; feedback arrives with an annotated screenshot."
  url: https://calcofi.io/explore/

- date: 2026-09-04
  type: site
  title: "Brand v2 — the SIO look, fleet-wide"
  body: "Light by default, the UC San Diego palette, Source Sans 3 and Teko, the horizontal lockup; ?theme=dark everywhere, remembered across calcofi.io; checked weekly."
  url: https://calcofi.io/brand/v2/

- date: 2026-08-31
  type: data
  title: "One climatology for every anomaly"
  body: "A 1993–2013, month-matched, 10 m-binned baseline ships in the release; ctd-transects, the Explorer's Sections lens and calcofi4r::cc_climatology() now subtract the same table."
  url: https://storage.calcofi.io/calcofi-db/ducklake/releases/RELEASES.html#one-climatology-for-every-anomaly

- date: 2026-08-25
  type: data
  title: "Quality flags reach the plots"
  body: "A 1955 oxygen spike flagged suspect since 1955 had been drawn for years; every consumer now applies each dataset's own quality flags. Cruise keys resolve by date span, so casts stop drifting onto the neighbouring month's cruise."
  url: https://storage.calcofi.io/calcofi-db/ducklake/releases/RELEASES.html#a-quality-flag-now-reaches-every-consumer-not-just-the-database
