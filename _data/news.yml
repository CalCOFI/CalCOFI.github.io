# The ship's log — the HAND-WRITTEN rows (plan 2026-09-07 § D-5). Everything else in the log is
# generated by _plugins/news.rb: releases from _data/versions.json, datasets entering the release
# from the record's since_version, apps from products.yml `added:`. Write a row here for what the
# data cannot say — a feature, a change to the site, a paper.
#
#   date:   YYYY-MM-DD
#   type:   data | site | paper   (release · dataset · app are generated; a row with `version:` or
#           `dataset_key:` OVERRIDES the generated entry of that key — for a wrong since_version or a
#           notes heading that is not the story)
#   title:  one line, declarative
#   body:   one or two sentences
#   url:    where to read more
#
# Types are quiet chips, none is yellow: --warn marks a state that needs attention, never a kind of
# thing. Dates below are from RELEASES.md and the repos' merge dates.

- date: 2026-09-07
  type: site
  title: "The front door shows the ship, the water and the years"
  body: "Line 90 drawn as a section — the ship, its gear to depth, one pin per data category — with the station grid and every dataset's measured years under it. Every colour is a brand token; every number is read from the release."
  url: https://calcofi.io/

- date: 2026-09-06
  type: app
  key: explore-calm
  title: "Explorer: the calm layout is live"
  body: "Floating panels you can move, collapse and resize; the title sentence is the query; every view is a URL you can share; feedback arrives with an annotated screenshot."
  url: https://calcofi.io/explore/

- date: 2026-09-04
  type: site
  title: "Brand v2 — the SIO look, fleet-wide"
  body: "Light by default, the UC San Diego palette, Source Sans 3 and Teko, the horizontal lockup; ?theme=dark everywhere, remembered across calcofi.io; checked weekly."
  url: https://calcofi.io/brand/v2/

- date: 2026-08-31
  type: data
  title: "One climatology for every anomaly"
  body: "A 1993–2013, month-matched, 10 m-binned baseline ships in the release; ctd-transects, the Explorer's Sections lens and calcofi4r::cc_climatology() now subtract the same table."
  url: https://storage.calcofi.io/calcofi-db/ducklake/releases/RELEASES.html

- date: 2026-08-25
  type: data
  title: "Quality flags reach the plots"
  body: "A 1955 oxygen spike flagged suspect since 1955 had been drawn for years; every consumer now applies each dataset's own quality flags. Cruise keys resolve by date span, so casts stop drifting onto the neighbouring month's cruise."
  url: https://storage.calcofi.io/calcofi-db/ducklake/releases/RELEASES.html
