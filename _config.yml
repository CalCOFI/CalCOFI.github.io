# CalCOFI.io — Jekyll landing site at https://calcofi.io/
# Product cards are driven by _data/products.yml (replaces the old Google Sheet
# + index.Rmd + bs4cards build). Edit the YAML, push to main, done.
# Built by .github/workflows/pages.yml (Jekyll 4.3); siblings: schema, query,
# workflows (_output).

title:       "CalCOFI.io"
description: "Interactive apps, data access and open-source tooling built on the CalCOFI integrated database."
url:         "https://calcofi.io"
baseurl:     ""
markdown:    kramdown

ga_tag: G-0HVK8TDMCF

# sibling sites each card links to per-product, via its `uptime:` / `usage:` slug
status_url:    "https://status.calcofi.io"
analytics_url: "https://calcofi.io/analytics"

# ── the dataset catalog (/datasets/, /data.json) ────────────────────────────
# The record is _data/datasets.json, fetched from the promoted release by scripts/fetch_release.sh
# and turned into pages by _plugins/datasets.rb. Nothing about a dataset is configured here — these
# are the site's own addresses, in one place so they change once (plan Decisions 22, 23).
contact_email:     "data@calcofi.io"        # the public contact in JSON-LD and DCAT (Decision 23)
# Registration is ENCOURAGED, NEVER REQUIRED (Decision 22): no endpoint on calcofi.io gates on it.
register_use_url:  "https://github.com/CalCOFI/workflows/issues/new?labels=derived-product&title=Registered+use%3A+"
stay_informed_url: "mailto:data@calcofi.io?subject=CalCOFI%20release%20updates"  # → a sign-up form when one exists

# ── feedback (the Explorer's dialog, ported: assets/feedback.js) ────────────────────────────────
# The Apps Script endpoint calcofi4r::cc_feedback_script() generates, shared with the Explorer (the
# same "CalCOFI app feedback" Sheet, recipients tab and Drive folder; the /exec URL is public in the
# Explorer's bundle, so it is written here rather than kept as a repository variable). The script
# routes the public issue by the payload's `app`: this site sends `calcofi-io`, and the script must
# be regenerated with repos = c(explore = "CalCOFI/explore", "calcofi-io" = "CalCOFI/CalCOFI.github.io")
# and re-pasted for the issue step to run — until then a report still reaches the Sheet and the mail,
# and the dialog's own "Open as GitHub issue myself" files it here. Empty = no endpoint: the dialog
# offers only the prefilled issue.
feedback_url: "https://script.google.com/macros/s/AKfycby8SIv9aBTXGBqKpPxLGox6YV2ZvqXwxvpwFq7Z9uFWLS8ik38_bADnMKlOJ_JolcfI/exec"
feedback_repo: "CalCOFI/CalCOFI.github.io"

# Jekyll drops every file whose name starts with `_` — including two of stac-browser's
# hashed chunks under stac/assets/ (`_commonjsHelpers-*.js`, `__vite-browser-external-*.js`),
# which left calcofi.io/stac/ a blank page (2026-09-05). After a stac-browser rebuild, update
# the two hashed names here (stac/README.md).
include:
  - stac/assets/_commonjsHelpers-CE1G-McA.js
  - stac/assets/__vite-browser-external-B1O5LaIO.js
  - "stac/assets/_*"
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - .jekyll-cache
  - scripts            # screenshot tooling (shots.sh); recipes live in _data/shots.yml
