{%- comment -%}
  What the Download dialog offers (_plugins/downloads.rb `Downloads.offer`, page.download). Drawn
  twice on a dataset page: inside the <dialog> (assets/download.js opens it) and, for a browser with
  JavaScript off, inside a <noscript> section — so every option is a plain link either way.

    1. the plain formats: CSV first (the default action, autofocused in the dialog), then Excel, or
       the release's own reason Excel is not offered
    2. "Only want part of it?" — the Explorer opened on this dataset (else the SQL shell)
    3. Other formats: the Parquet zip, ERDDAP's subset form, the CF netCDF, every endpoint
    4. the licence, from the record (an unstated one is said to be unstated), and "register your use"

  Every download is a real <a href download> to the zip, carrying data-dl-key / data-dl-format for
  assets/download.js's analytics event.

  include params: dl (page.download) · idp (id prefix, distinct per copy) · autofocus (true in the dialog)
{%- endcomment -%}
{%- assign dl = include.dl -%}
{%- assign idp = include.idp | default: "dl" -%}
{%- assign lic = dl.licence -%}
<p class="dl-lede" id="{{ idp }}-desc">
  {%- if dl.version %}Verified against release <span class="mono">{{ dl.version | escape }}</span>
  {%- if dl.since %}; the data are unchanged since <span class="mono">{{ dl.since | escape }}</span>{% endif %}.{% endif %}</p>
<ul class="dl-opts">
  {%- for o in dl.main -%}
  {%- if o.written -%}
  <li class="dl-opt{% if o.primary %} is-primary{% endif %}">
    <a class="cc-btn {% if o.primary %}cc-btn-primary{% else %}cc-btn-ghost{% endif %} dl-get" href="{{ o.url | escape }}" download="{{ o.file | escape }}" type="application/zip"
       data-dl-key="{{ dl.key | escape }}" data-dl-format="{{ o.format | escape }}"{% if o.primary and include.autofocus %} autofocus{% endif %}>
      <i class="cc-i cc-i-ui-download" aria-hidden="true"></i><span>{{ o.label | escape }}</span>{% if o.size %}<span class="dl-get-n">{{ o.size | escape }} zip</span>{% endif %}</a>
    {%- if o.about != "" or o.primary %}<p class="dl-about">{{ o.about | escape }}{% if o.primary %}{% if o.tables.size > 0 %}Inside: {{ o.tables.size }} data table{% if o.tables.size != 1 %}s{% endif %} ({{ o.tables | join: ", " | escape }}), {{ dl.inside }}.{% else %}Inside: {{ o.inside | escape }}.{% endif %}{% endif %}</p>{% endif -%}
    {%- if o.note %}<p class="dl-note">{{ o.note | escape }}</p>{% endif -%}
  </li>
  {%- else -%}
  <li class="dl-opt is-off">
    <span class="dl-off"><span class="dl-off-t">{{ o.label | escape }}</span></span>
    <p class="dl-note">{{ o.reason | escape }}</p>
  </li>
  {%- endif -%}
  {%- endfor -%}
</ul>
{%- if dl.part -%}
<p class="dl-part"><b>Just part of it?</b> Pick years, an area or variables
  {% if dl.part.app %}in the <a href="{{ dl.part.url | escape }}">Explorer</a>{% else %}with SQL in <a href="{{ dl.part.url | escape }}">{{ dl.part.label | escape }}</a>{% endif %}.</p>
{%- endif -%}
<h3 class="dl-h" id="{{ idp }}-other">Other formats</h3>
<ul class="dl-more" aria-labelledby="{{ idp }}-other">
  {%- for o in dl.other -%}
  <li><a href="{{ o.url | escape }}" download="{{ o.file | escape }}" type="application/zip" data-dl-key="{{ dl.key | escape }}" data-dl-format="{{ o.format | escape }}"><i class="cc-i cc-i-ui-download" aria-hidden="true"></i>{{ o.label | escape }}{% if o.size %} · {{ o.size | escape }} zip{% endif %}</a>
    <span>{{ o.about | escape }}</span></li>
  {%- endfor -%}
  {%- for e in dl.endpoints -%}
  <li><a href="{{ e.url | escape }}"><i class="cc-i cc-i-way-file" aria-hidden="true"></i>{{ e.label | escape }}</a> <span>{{ e.about | escape }}</span></li>
  {%- endfor -%}
  <li><a href="#access" data-dl-endpoints><i class="cc-i cc-i-el-endpoints" aria-hidden="true"></i>Every endpoint</a> <span>every table, ERDDAP and code, on this page</span></li>
</ul>
<p class="dl-lic dl-lic-{{ lic.kind | escape }}"><svg class="dl-lic-i" aria-hidden="true"><use href="#i-licence"/></svg><span><b>Licence:</b> {% if lic.contact %}{% capture mail %}<a href="mailto:{{ lic.contact | escape }}">{{ lic.contact | escape }}</a>{% endcapture %}{{ lic.text | escape | replace: lic.contact, mail }}{% else %}{{ lic.text | escape }}{% endif %}
  {%- if lic.url %} <a href="{{ lic.url | escape }}" rel="{% if lic.kind == 'custom' %}external{% else %}license external{% endif %}">{{ lic.url_label | escape }} ↗</a>{% endif %}</span></p>
<p class="dl-reg">No sign-up, ever. If you publish or build with it,
  <a href="{{ site.register_use_url }}">register your use</a> (optional) so it can be credited.</p>
